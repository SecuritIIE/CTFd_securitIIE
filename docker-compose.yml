# Nom de projet figé -> les réseaux s'appellent ctfd_frp_containers, ctfd_frp_connect...
# (référencés tels quels dans la config Whale: whale:docker_auto_connect_network)
name: ctfd

services:
  ctfd:
    build: .
    # root est nécessaire pour accéder au socket Docker monté (spawn des challenges via Whale)
    user: root
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - UPLOAD_FOLDER=/var/uploads
      - DATABASE_URL=mysql+pymysql://ctfd:ctfd@db/ctfd
      - REDIS_URL=redis://cache:6379
      - WORKERS=1
      - LOG_FOLDER=/var/log/CTFd
      - ACCESS_LOG=-
      - ERROR_LOG=-
      - REVERSE_PROXY=true
    volumes:
      - .data/CTFd/logs:/var/log/CTFd
      - .data/CTFd/uploads:/var/uploads
      - .:/opt/CTFd:ro
      # Whale pilote Docker (swarm) via le socket
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      permissions:
        condition: service_completed_successfully
      db:
        condition: service_started
      cache:
        condition: service_started
      frpc:
        condition: service_started
    networks:
        default:
        internal:
        frp_connect:

  # ---- CTFd-Whale : reverse proxy frp ----
  frps:
    image: glzjin/frp
    restart: always
    volumes:
      - ./conf/frp:/conf
    entrypoint:
      - /usr/local/bin/frps
      - -c
      - /conf/frps.ini
    ports:
      - "10000-10100:10000-10100"  # challenges "direct" (nc host port)
      - "8001:8001"                # challenges "http" (vhost)
    depends_on:
      - cache
    networks:
      default:       # pour publier les ports sur l'hôte
      frp_connect:

  frpc:
    image: glzjin/frp
    restart: always
    volumes:
      - ./conf/frp:/conf
    entrypoint:
      - /usr/local/bin/frpc
      - -c
      - /conf/frpc.ini
    depends_on:
      - frps
    networks:
      # IP dynamique : une IP statique sur overlay swarm échoue (context deadline
      # exceeded). L'API admin frpc est protégée par Basic Auth (voir frpc.ini).
      frp_connect:
      frp_containers:

  # TODO: CTFd 4.0 Migrate to named volumes. Users will likely need to manually migrate existing files
  permissions:
    image: alpine:3.23
    user: root
    volumes:
      - .data/CTFd/logs:/var/log/CTFd
      - .data/CTFd/uploads:/var/uploads
    command: chown -R 1001:1001 /var/uploads /var/log/CTFd

  nginx:
    image: nginx:stable
    restart: always
    volumes:
      - ./conf/nginx/http.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - ctfd


  db:
    image: mariadb:10.11
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=ctfd
      - MARIADB_USER=ctfd
      - MARIADB_PASSWORD=ctfd
      - MARIADB_DATABASE=ctfd
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - .data/mysql:/var/lib/mysql
    networks:
        internal:
    # This command is required to set important mariadb defaults
    command: [mysqld, --character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --wait_timeout=28800, --log-warnings=0]

  cache:
    image: redis:4
    restart: always
    volumes:
    - .data/redis:/data
    networks:
        internal:

networks:
    default:
    internal:
        internal: true
    # frpc <-> frps <-> ctfd (overlay swarm, isolé de l'extérieur)
    frp_connect:
        driver: overlay
        internal: true
        attachable: true
        ipam:
            config:
                - subnet: 172.1.0.0/16
    # réseau des containers de challenge, joint par frpc pour les proxifier
    frp_containers:
        driver: overlay
        attachable: true
        internal: true
        ipam:
            config:
                - subnet: 172.2.0.0/16
