[common]
# Port frpc <-> frps (interne, réseau frp_connect). Ne doit PAS chevaucher
# la plage des challenges "direct" (10000-10100).
bind_port = 7897

# Port de mutualisation HTTP pour les challenges "http" (vhost).
# Doit correspondre à whale:frp_http_port dans la config Whale.
vhost_http_port = 8001

# Doit être identique au token de frpc.ini
token = 2df5300608fd41b02f34ea978976e1d7

# Domaine wildcard pour les challenges http : uuid.<subdomain_host>
# Nécessite un DNS wildcard *.ctf.securitiie.iiens.net -> serveur.
subdomain_host = ctf.securitiie.iiens.net
